name: Create Release Tag

# One-tap release tagging (usable from a phone). Creates the annotated vX.Y.Z tag
# that scripts/verify-release.mjs requires, then starts the Docker release build.
# Tags pushed with GITHUB_TOKEN do not trigger other workflows, so the build is
# dispatched explicitly.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, exact vX.Y.Z (for example v3.11.1)
        required: true
        type: string
      commit:
        description: Full SHA to tag. Must already be on main and have matching release metadata.
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: main

      - name: Validate input
        env:
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "Tag must be exactly vX.Y.Z"; exit 1; }
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "Commit must be a full 40-character SHA"; exit 1; }
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then echo "Tag $TAG already exists"; exit 1; fi
          git cat-file -e "$COMMIT^{commit}"
          git merge-base --is-ancestor "$COMMIT" origin/main || { echo "$COMMIT is not on main"; exit 1; }

      - name: Check release metadata at the commit
        env:
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
        run: |
          git checkout --quiet "$COMMIT"
          node -e "import('./scripts/verify-release.mjs').then(m => { console.log(m.validateReleaseMetadata('.', process.env.TAG)); })"

      - name: Create and push the annotated tag
        env:
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$COMMIT" -m "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Start the Docker release build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh workflow run docker.yml --ref main -f release_ref="$TAG"
